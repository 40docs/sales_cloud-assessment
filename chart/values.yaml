image:
  repository: ghcr.io/40docs/sales_cloud-assessment
  tag: ""
  pullPolicy: IfNotPresent

replicaCount: 2

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: true
  className: nginx
  host: assessment.example.com
  tls:
    enabled: true
    secretName: assessment-tls
    issuer: letsencrypt-prod
  rateLimit:
    rpm: 600
    connections: 20
  # Optional IP allowlist applied to /admin/* only.
  adminAllowCIDRs: []

publicUrl: "https://assessment.example.com"

secret:
  create: true
  jwtPrivateKey: ""    # base64 ed25519 seed (openssl rand -base64 32)
  adminPassword: ""    # password for the /admin browser portal
  adminToken: ""       # optional bearer for CLI scripts
  ipSalt: "change-me"

postgres:
  cnpg:
    enabled: true
    instances: 2
    storage:
      size: 5Gi
      storageClass: ""
  externalUrl: ""

resources:
  limits: { cpu: 200m, memory: 128Mi }
  requests: { cpu: 50m, memory: 64Mi }

autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70

podSecurityContext:
  fsGroup: 65532
  runAsNonRoot: true
  runAsUser: 65532
  seccompProfile: { type: RuntimeDefault }

securityContext:
  allowPrivilegeEscalation: false
  capabilities: { drop: ["ALL"] }
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 65532

networkPolicy:
  enabled: true
  ingressControllerNamespace: ingress-nginx
  ingressControllerPodLabels:
    app.kubernetes.io/name: ingress-nginx
  dnsNamespace: kube-system

podDisruptionBudget:
  enabled: true
  minAvailable: 1

nodeSelector: {}
tolerations: []
affinity: {}
