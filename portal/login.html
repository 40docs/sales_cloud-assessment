<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Assessment Admin · Sign in</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#000;--text:#f5f5f7;--text2:#86868b;--text3:#48484a;--red:#DA291C}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;-webkit-font-smoothing:antialiased}
.card{width:100%;max-width:380px;padding:32px;border:1px solid rgba(255,255,255,0.08);border-radius:18px;background:rgba(255,255,255,0.02)}
.eyebrow{font-size:11px;font-weight:600;letter-spacing:1.8px;text-transform:uppercase;color:var(--text3);margin-bottom:8px}
.title{font-size:22px;font-weight:700;margin-bottom:4px}
.sub{font-size:13px;color:var(--text2);margin-bottom:24px;line-height:1.55}
form{display:flex;flex-direction:column;gap:12px}
input{padding:14px 16px;border-radius:12px;border:1px solid rgba(255,255,255,0.1);background:rgba(255,255,255,0.04);color:var(--text);font-size:14px;font-family:inherit;outline:none;text-align:center}
input:focus{border-color:rgba(218,41,28,0.5)}
button{padding:14px;border-radius:12px;background:var(--red);color:#fff;font-size:13px;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;border:none;cursor:pointer;font-family:inherit}
button:hover{filter:brightness(1.08)}
.err{font-size:12px;color:var(--red);margin-top:6px;min-height:16px;text-align:center;font-weight:600}
</style>
</head>
<body>
<div class="card">
  <div class="eyebrow">Sales Cloud Assessment</div>
  <div class="title">Sign in</div>
  <div class="sub">Enter the admin password to mint event tokens.</div>
  <form method="POST" action="/admin/login">
    <input type="password" name="password" placeholder="Password" autofocus required>
    <button type="submit">Continue</button>
    <div class="err">{{ .Err }}</div>
  </form>
</div>
</body>
</html>
