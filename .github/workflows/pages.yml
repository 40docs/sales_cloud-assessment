name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Stage mockup-only artifact
        run: |
          mkdir -p dist
          cp security-maturity-assessment.html         dist/
          cp security-maturity-assessment-browser.html dist/
          cp security-maturity-assessment-mobile.html  dist/
          cp -r admin                                  dist/
          cat > dist/index.html << 'HTML'
          <!DOCTYPE html>
          <html>
          <head><meta http-equiv="refresh" content="0; url=security-maturity-assessment.html"></head>
          <body></body>
          </html>
          HTML

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
