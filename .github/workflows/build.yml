name: Build & publish container

on:
  push:
    branches: [main]
    paths:
      - '**.go'
      - 'go.mod'
      - 'go.sum'
      - 'security-maturity-assessment-*.html'
      - 'portal/**'
      - 'migrations/**'
      - 'Containerfile'
      - '.github/workflows/build.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: Resolve modules
        run: go mod tidy

      - name: Vet
        run: go vet ./...

      - name: Build (sanity)
        run: go build ./...

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,prefix=
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Containerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  update-manifests:
    name: Bump dev-infra image tag
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout dev-infrastructure-2026
        uses: actions/checkout@v4
        with:
          repository: amerintlxperts/dev-infrastructure-2026
          token: ${{ secrets.PAT }}
          path: manifests

      - name: Bump assessment image tag (Helm value)
        run: |
          cd manifests
          yq -i '.spec.source.helm.valuesObject.image.tag = "${{ needs.build.outputs.image_tag }}"' \
            manifests-platform/resources/assessment/application.yaml

      - name: Commit and push
        working-directory: manifests
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git diff --staged --quiet && exit 0
          git commit -m "chore: update assessment to ${{ needs.build.outputs.image_tag }}"
          for i in {1..5}; do
            git push && exit 0
            echo "Push failed, pulling and retrying ($i/5)..."
            git pull --rebase
            sleep $((i * 2))
          done
          exit 1
